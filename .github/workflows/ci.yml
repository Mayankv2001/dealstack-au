name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On a PR, only the newest push matters: group by ref and cancel superseded
# runs. On main, every commit must get its own COMPLETED run — a commit that
# lands without CI finishing is a commit nothing ever verified, which is how
# 9851194 and 0db3159 reached main with no result. Grouping main by SHA gives
# each commit an isolated group, so nothing cancels or queues behind anything
# else. Sharing one group with cancel-in-progress:false would NOT be enough:
# GitHub keeps only one pending run per group, so a third rapid push cancels
# the second's queued run and that commit still goes unverified.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # One whole-tree vitest run (tests/e2e is excluded in vitest.config.ts).
      # Replaced seven per-directory steps: a directory could only run if
      # somebody remembered to add a script for it, which is how
      # tests/text sat unexecuted for twelve days.
      - run: npm run test
      - run: npm run build
      - name: Smoke test the production build
        # `next start` is a production runtime and the data-source boundary
        # fails closed without Supabase env — CI must declare static demo
        # mode explicitly (same acknowledgement as playwright.config.ts).
        env:
          DATA_SOURCE: static
          DATA_SOURCE_STATIC_PREVIEW_ACK: serve-demo-data-not-production
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000 && break
            sleep 2
          done
          npm run smoke
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (static-fallback data)
        # No Supabase env in CI, so pages serve deterministic static data.
        # Reuses the build from the step above; Playwright starts its own
        # `next start` on a dedicated port (playwright.config.ts).
        run: npm run test:e2e
